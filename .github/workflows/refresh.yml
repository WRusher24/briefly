name: Refresh briefings

# Triggers the 4-hourly ingestion + AI synthesis job on your deployed app.
# Vercel Hobby only allows daily cron jobs, so GitHub Actions provides the 4-hour cadence for free.
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/refresh
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are not set — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/refresh"
